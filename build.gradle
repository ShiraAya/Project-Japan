plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Keep generated W05 identifiers and Japanese source text portable on Windows hosts whose
// default javac charset is GBK. All project Java sources are UTF-8.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets {
    main.resources { srcDir 'src/generated/resources' }
    validation {
        java.srcDir 'src/validation/java'
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += output + compileClasspath + main.runtimeClasspath
    }
}


dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def props = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                 forge_version: forge_version, forge_version_range: forge_version_range,
                 loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
                 mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
                 mod_description: mod_description]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand props + [project: project] }
}

tasks.named('jar', Jar).configure {
    from('ATTRIBUTION.md') {
        into 'META-INF'
        rename { 'PROJECTJAPAN-ATTRIBUTION.md' }
    }
    from('THIRD_PARTY_LICENSES') {
        into 'META-INF/THIRD_PARTY_LICENSES'
    }
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

